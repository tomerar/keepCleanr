org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
# Reproducible builds (C194): R8's optimized resource shrinking (AGP 9 default) reads the merged resources by their
# absolute paths, and R8 9.5.28/9.5.29's code optimisation depends on those paths and their order, so two checkouts
# at different paths produced different classes.dex. Off, R8 gets no resource input and resources are shrunk by
# AGP's separate resource shrinker instead. The option is deprecated (AGP warns; removed in AGP 10): revisit then.
android.r8.optimizedResourceShrinking=false
