org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
# Reproducible builds (C199, correcting C194): R8 9.5.28 and 9.5.29 are nondeterministic in their argument propagation
# (the same inputs at the same path give one of two classes.dex from run to run, even single-threaded), fixed upstream
# in 9.6 ("Fix nondeterminism when compiling AGSA", r8 953faf495b). Until a stable AGP ships an R8 with that fix, the
# release build uses R8 9.6.0-alpha09 through AGP's R8 version override (AGP warns that the option is experimental).
# Drop the override when AGP's own R8 has the fix, and check with scripts/reproducible-build.sh.
android.r8.versionOverride=9.6.0-alpha09
# Kept from C194 (not the cause, see C199): R8 gets the merged resources only as keep-rule files; deprecated, AGP
# warns on every build and AGP 10 removes it.
android.r8.optimizedResourceShrinking=false
