# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # "Run workflow" on main also builds the test APK

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Build, tests, lint, policies
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Build-logic unit tests (policy checkers)
        run: ./gradlew -p build-logic test
      - name: Samba test server for the SMB target's integration tests (M15)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends samba
          scripts/samba-test-server.sh | sed 's/^export //' >> "$GITHUB_ENV"
      - name: ciCheck (format, string parity, unit + screenshot tests, Konsist, lint, manifest + dependency policies, both flavors)
        run: ./gradlew ciCheck :app:assembleFossRelease :app:assemblePlayRelease
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
            app/build/outputs/roborazzi/

  emulator:
    name: Launch smoke test (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [30, 36]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented tests (launch smoke test, MediaStore seeding)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew :app:connectedFossDebugAndroidTest :core:storage-media:connectedDebugAndroidTest :backup:target-saf:connectedDebugAndroidTest :core:storage-saf:connectedDebugAndroidTest
      - name: Show failed instrumented tests
        if: failure()
        run: |
          find . -path '*outputs/androidTest-results*' -name '*.xml' -print0 \
            | xargs -0 -r grep -l '<failure' \
            | while read -r f; do echo "== $f"; sed -n '/<failure/,/<\/failure>/p' "$f" | head -80; done

  test-apk:
    # A test build for the owner's phone, downloadable from the Actions run page (no GitHub Release).
    name: Test APK (fossDebug)
    if: github.event_name != 'pull_request'
    needs: [checks]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: true
      - name: Build fossDebug
        run: |
          ./gradlew :app:assembleFossDebug
          short=$(git rev-parse --short HEAD)
          cp app/build/outputs/apk/foss/debug/app-foss-debug.apk "keepclear-test-${GITHUB_RUN_NUMBER}-${short}.apk"
      - name: Upload test APK
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          path: keepclear-test-*.apk
          archive: false
          retention-days: 30
          if-no-files-found: error
